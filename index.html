<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مركز مستندات المشروع</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="بناة المستقبل">
<meta name="theme-color" content="#0E1622">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1622; --ink2:#1B2635;
  --paper:#F4F6F9; --card:#FFFFFF;
  --line:#DFE4EB; --line2:#EEF1F5;
  --steel:#6A7789;
  --gold:#BF9000; --gold-lt:#D9A80C; --gold-deep:#8A6800; --gold-soft:#FAF2DC;
  --r:5px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif;
  background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",monospace;direction:ltr;unicode-bidi:embed}
button{font-family:inherit}

/* ===== شريط علوي ===== */
.topbar{
  background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;
  padding:0 20px;height:62px;border-bottom:3px solid var(--gold);
  position:sticky;top:0;z-index:40;
}
.burger{display:none;background:transparent;border:1px solid #2E3D51;color:#fff;
  width:34px;height:34px;border-radius:var(--r);cursor:pointer;font-size:16px}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{height:38px;width:auto;display:block}
.brand h1{font-size:15px;font-weight:600;letter-spacing:-.2px}
.brand p{font-size:11px;color:#8FA2BE;font-weight:300;margin-top:-3px}
.proj{margin-inline-start:auto}
.proj select{background:#1B2635;color:#E8EDF5;border:1px solid #2E3D51;
  padding:8px 12px;border-radius:var(--r);font-family:inherit;font-size:13px;min-width:240px;cursor:pointer}
.roleswitch{display:flex;background:#1B2635;border:1px solid #2E3D51;border-radius:var(--r);padding:2px}
.roleswitch button{background:none;border:0;color:#8FA2BE;font-size:12px;padding:5px 12px;
  border-radius:3px;cursor:pointer;white-space:nowrap}
.roleswitch button.on{background:var(--gold);color:#1B1200;font-weight:600}
.who{display:flex;align-items:center;gap:9px;padding-inline-start:16px;border-inline-start:1px solid #2A3646}
.confidential-note{font-size:12px;color:#8FA2BE;font-weight:500;padding-inline-start:16px;
  border-inline-start:1px solid #2A3646;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#1B1200;display:grid;place-items:center;font-size:12px;font-weight:600}
.who p{font-size:12.5px;font-weight:500}
.who span{font-size:11px;color:#8FA2BE}

.shell{display:flex;min-height:calc(100vh - 62px)}

/* ===== القائمة الجانبية ===== */
.side{
  width:262px;flex-shrink:0;background:var(--card);border-inline-start:1px solid var(--line);
  padding:16px 0 40px;position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto;
}
.grp{font-size:10.5px;letter-spacing:1.4px;color:#95A1B3;font-weight:600;padding:0 20px;margin:0 0 8px}
.grp:not(:first-child){margin-top:24px}

.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 20px;border:0;
  background:none;cursor:pointer;font-size:14px;color:var(--ink2);text-align:start;
  border-inline-end:3px solid transparent;transition:background .12s}
.nav:hover{background:#F4F6FA}
.nav.on{background:var(--gold-soft);color:var(--gold-deep);font-weight:600;border-inline-end-color:var(--gold)}
.nav .n{margin-inline-start:auto;font-size:11px;color:#8B98AC;font-family:"IBM Plex Mono",monospace;
  background:#F0F2F6;padding:1px 7px;border-radius:20px}
.nav.on .n{background:#fff;color:var(--gold-deep)}
.ico{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.6}

.nav.parent .caret{margin-inline-start:auto;width:11px;height:11px;stroke:#98A4B6;fill:none;stroke-width:2;
  transition:transform .18s}
.nav.parent.open .caret{transform:rotate(-90deg)}
.sub{overflow:hidden;max-height:0;transition:max-height .22s ease}
.sub.open{max-height:220px}
.nav.child{padding-inline-start:48px;font-size:13.5px;color:var(--steel);position:relative}
.nav.child::before{content:"";position:absolute;inset-inline-start:29px;top:0;bottom:0;width:1px;background:var(--line)}
.nav.child.on{color:var(--gold-deep);font-weight:600}

/* ===== المحتوى ===== */
.main{flex:1;padding:26px 30px 60px;min-width:0}
.crumb{font-size:12px;color:var(--steel);margin-bottom:4px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.head h2{font-size:25px;font-weight:600;letter-spacing:-.5px}
.head .cnt{font-size:13px;color:var(--steel)}

/* بطاقة آخر ملف */
.latest{
  background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--gold);
  padding:20px 24px;margin-bottom:22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
}
.latest .tag{font-size:10.5px;letter-spacing:1.3px;color:var(--gold-deep);font-weight:600;
  display:block;margin-bottom:6px}
.latest h3{font-size:22px;font-weight:600;letter-spacing:-.5px;line-height:1.3}
.latest .meta{font-size:13px;color:var(--steel);margin-top:3px}
.latest .amt{margin-inline-start:auto;text-align:end}
.latest .amt p{font-size:10.5px;letter-spacing:.8px;color:var(--steel);font-weight:500}
.latest .amt strong{font-size:24px;font-weight:600;letter-spacing:-.5px;display:block}
.latest .go{display:flex;gap:8px}

.btn{font-size:13.5px;font-weight:500;cursor:pointer;padding:9px 17px;border-radius:var(--r);
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  display:inline-flex;align-items:center;gap:7px;transition:.13s}
.btn:hover{border-color:#B9C3D2;background:#FAFBFC}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1B1200;font-weight:600}
.btn.primary:hover{background:#A87E00}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* بحث */
.search{position:relative;margin-bottom:14px;max-width:420px}
.search input{width:100%;padding:10px 38px 10px 13px;border:1px solid var(--line);
  border-radius:var(--r);font-family:inherit;font-size:13.5px;background:#fff}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.search svg{position:absolute;inset-inline-end:12px;top:11px;width:15px;height:15px;stroke:#9AA6B8;fill:none;stroke-width:1.8}

/* قائمة الملفات */
.files{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.file{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line2);
  cursor:pointer;transition:background .12s}
.file:last-child{border-bottom:0}
.file:hover{background:#F7F9FC}
.pdf{width:38px;height:44px;flex-shrink:0;background:#fff;border:1px solid var(--line);
  border-radius:3px;display:grid;place-items:center;position:relative;overflow:hidden}
.pdf::after{content:"PDF";font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;
  color:#fff;background:#C1272D;position:absolute;bottom:0;inset-inline-start:0;right:0;text-align:center;padding:1px 0}
.pdf .lines{width:20px;height:14px;margin-bottom:8px;
  background:repeating-linear-gradient(#DCE1E9 0 2px,transparent 2px 5px)}
.f-txt{min-width:0;flex:1}
.f-txt h4{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-txt p{font-size:12.5px;color:var(--steel);margin-top:1px}
.f-amt{font-size:15px;font-weight:600;white-space:nowrap;font-family:"IBM Plex Mono",monospace;direction:rtl}
.f-amt small{font-size:11px;font-weight:400;color:var(--steel);margin-inline-start:3px}
.f-date{font-size:12.5px;color:var(--steel);white-space:nowrap;min-width:96px;text-align:end}
.f-act{display:flex;gap:6px}
.ib{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:var(--r);
  display:grid;place-items:center;cursor:pointer;color:var(--steel)}
.ib:hover{border-color:var(--gold);color:var(--gold-deep)}

/* رفع */
.dz{margin-top:18px;border:1.5px dashed #C6CFDC;border-radius:6px;background:#FBFCFD;
  padding:24px;text-align:center;cursor:pointer;transition:.15s}
.dz:hover,.dz.hot{border-color:var(--gold);background:var(--gold-soft)}
.dz p{font-size:14px;font-weight:500}
.dz span{font-size:12.5px;color:var(--steel)}

.empty{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:46px 20px;text-align:center}
.empty p{font-size:15px;font-weight:500;margin-bottom:3px}
.empty span{font-size:13px;color:var(--steel)}

/* لوحة مؤشرات الأداء */
.kpi-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;margin-bottom:14px}
.kp-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.kp-lbl{width:44px;flex-shrink:0;font-size:12.5px;font-weight:600;color:var(--steel)}
.kp-bar{position:relative;flex:1;height:14px;background:var(--line2);border-radius:20px;overflow:hidden}
.kp-bar.outline{background:#fff;border:1.5px dashed var(--line)}
.kp-fill{position:absolute;inset-inline-end:0;top:0;bottom:0;background:var(--gold);border-radius:20px}
.kp-fill.outline{background:transparent;border-inline-start:2px dashed var(--gold-deep)}
.kp-val{width:38px;flex-shrink:0;font-size:13px;font-weight:600;text-align:left}
.kp-diff{font-size:13px;font-weight:700;margin:2px 0 0}
.kv-table{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv-row{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;
  border-bottom:1px solid var(--line2);font-size:13px}
.kv-row:last-child{border-bottom:0}
.kv-row span{color:var(--steel)}
.kv-row strong{font-weight:600}

.kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv-card{background:var(--card);border:1px solid var(--line);border-inline-start:3px solid var(--gold);
  border-radius:var(--r);padding:14px 16px}
.kv-card .kv-lbl{font-size:11px;color:var(--steel);font-weight:500;margin-bottom:6px}
.kv-card .kv-val{font-size:15.5px;font-weight:600;letter-spacing:-.2px}
.kv-card.wide{grid-column:span 2}
@media (max-width:520px){.kv-card.wide{grid-column:span 1}}


/* عارض الملف */
.ov{position:fixed;inset:0;background:rgba(14,22,34,.74);z-index:60;display:none;
  align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(3px)}
.ov.show{display:flex;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#E7EAEF;width:min(880px,100%);max-height:93vh;border-radius:6px;
  display:flex;flex-direction:column;overflow:hidden;animation:rise .2s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.mh{background:var(--ink);color:#fff;padding:13px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.mh h4{font-size:15px;font-weight:600}
.mh p{font-size:11.5px;color:#8FA2BE}
.mh .btn{margin-inline-start:auto}
.x{background:none;border:0;color:#93A6C2;font-size:25px;cursor:pointer;line-height:1;padding:0 4px}
.x:hover{color:#fff}
.viewer{overflow-y:auto;padding:22px;display:flex;justify-content:center;flex:1 1 auto;min-height:0}
.gframe{width:100%;height:72vh;border:0;background:#fff;border-radius:4px;box-shadow:0 2px 14px rgba(14,22,34,.15)}
.viewer:has(.gframe){padding:14px}
.sheet{width:100%;max-width:600px;background:#fff;box-shadow:0 2px 14px rgba(14,22,34,.15);
  padding:32px;font-size:13px;min-height:560px}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2px solid var(--ink);padding-bottom:11px;margin-bottom:16px}
.sheet-top h5{font-size:17px;font-weight:600}
.sheet-top p{font-size:11.5px;color:var(--steel)}
.letterhead{height:64px;width:auto;flex-shrink:0}
.sheet-top{border-bottom-color:var(--gold)}
.sheet h6{font-size:10.5px;letter-spacing:1px;color:var(--steel);margin:18px 0 8px;font-weight:600}
.sheet table{width:100%;border-collapse:collapse;font-size:12.5px}
.sheet td,.sheet th{padding:7px 9px;border:1px solid var(--line);text-align:start}
.sheet th{background:#F5F6F8;font-size:10.5px}
.sheet .tot td{background:#F5F6F8;font-weight:600}
.note{color:var(--steel);font-size:12.5px}


/* شاشة الإعدادات */
.gear{width:34px;height:34px;border:1px solid #2E3D51;background:transparent;color:#C9D4E4;
  border-radius:var(--r);display:grid;place-items:center;cursor:pointer}
.gear:hover{border-color:var(--gold);color:var(--gold-lt)}
.setwrap{padding:20px;overflow-y:auto;background:var(--paper);flex:1 1 auto;min-height:0}
.setintro{background:var(--gold-soft);border:1px solid #E8D9A8;border-radius:var(--r);
  padding:13px 16px;font-size:13px;margin-bottom:16px;line-height:1.8}
.setrow{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.setrow label{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
.setrow .hint{font-size:11.5px;color:var(--steel);margin-bottom:8px}
.setrow textarea{width:100%;min-height:60px;padding:9px 11px;border:1px solid var(--line);
  border-radius:var(--r);font-family:"IBM Plex Mono",monospace;font-size:12px;
  direction:ltr;text-align:left;resize:vertical;background:#FCFCFD}
.setrow textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.setrow.filled{border-inline-start:3px solid var(--gold)}
.setbar{display:flex;gap:9px;padding:14px 20px;background:#fff;border-top:1px solid var(--line);
  flex-wrap:wrap;flex-shrink:0;position:sticky;bottom:0;z-index:2;box-shadow:0 -3px 10px rgba(14,22,34,.06)}
.setbar .note{font-size:11.5px;color:var(--steel);margin-inline-start:auto;align-self:center}
.folderframe{width:100%;height:66vh;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:var(--r);font-size:13.5px;z-index:80;
  transform:translateY(70px);opacity:0;transition:.25s;border-inline-start:3px solid var(--gold)}
.toast.show{transform:none;opacity:1}

@media (max-width:900px){
  .latest{flex-direction:column;align-items:flex-start;gap:14px}
  .latest .amt{margin-inline-start:0;text-align:start}
  .f-date{display:none}
}
@media (max-width:760px){
  .burger{display:grid}
  .side{position:fixed;inset-inline-start:-270px;z-index:50;transition:.2s;box-shadow:0 0 30px rgba(0,0,0,.22)}
  .side.open{inset-inline-start:0}
  .main{padding:18px 15px 50px}
  .who{display:none}
  .roleswitch button{padding:5px 8px;font-size:11px}
  .proj select{min-width:120px}
  .f-amt{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ===================== ربط جوجل درايف بدون كود ===================== */
let CFG = {};

function idFromLink(t){
  t=(t||'').trim();
  let m = t.match(/\/folders\/([A-Za-z0-9_-]{15,})/);        if(m) return {type:'folder', id:m[1]};
  m = t.match(/\/file\/d\/([A-Za-z0-9_-]{15,})/);            if(m) return {type:'file',   id:m[1]};
  m = t.match(/[?&]id=([A-Za-z0-9_-]{15,})/);                if(m) return {type:'file',   id:m[1]};
  m = t.match(/\/document\/d\/([A-Za-z0-9_-]{15,})/);        if(m) return {type:'file',   id:m[1]};
  m = t.match(/\/spreadsheets\/d\/([A-Za-z0-9_-]{15,})/);    if(m) return {type:'file',   id:m[1]};
  if(/^[A-Za-z0-9_-]{20,}$/.test(t)) return {type:'file', id:t};
  return null;
}

/* يحوّل ما كتبه المستخدم إلى إعداد للتبويب */
function parseBox(text){
  const lines = (text||'').split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return null;

  const folders = lines.map(idFromLink).filter(r=>r && r.type==='folder');
  if(folders.length) return {folder: folders[0].id};

  const files=[];
  lines.forEach(l=>{
    let name='', link=l;
    if(l.includes('|')){ const p=l.split('|'); name=p[0].trim(); link=p.slice(1).join('|').trim(); }
    const r=idFromLink(link);
    if(r) files.push({n:name, i:r.id});
  });
  return files.length ? {files} : null;
}

function applyCfg(){
  const projCfg = CFG[curProj] || {};
  Object.keys(projCfg).forEach(k=>{
    if(k==='__kpi'){
      PROJECTS[curProj].kpi = {...(PROJECTS[curProj].kpi||{}), ...projCfg.__kpi};
      return;
    }
    if(k==='__kpiSheetUrl') return;
    if(!V[k]) return;
    const c=projCfg[k];
    V[k].folderId = c.folder || null;
    if(c.files && c.files.length){
      V[k].files = c.files.map((f,n)=>[f.n || ('مستند '+(n+1)), 'ملف على جوجل درايف', '', '', '', f.i]);
    }
  });
  fetchKpiSheet(curProj);
}

/* ===== مزامنة مؤشرات الأداء من جوجل شيت (Publish to web → CSV) =====
   ترتيب الأعمدة المتوقع في السطر الأول (رؤوس الأعمدة) والسطر الثاني (القيم):
   code,value,start,end,remaining,disbursed,actualPct,plannedPct,asOf */
function parseSheetCSV(text){
  const lines = text.trim().split(/\r?\n/).filter(Boolean);
  if(lines.length<2) return null;
  const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  const values  = lines[1].split(',').map(v=>v.trim().replace(/^"|"$/g,''));
  const obj={};
  headers.forEach((h,i)=> obj[h]=values[i]);
  return obj;
}
function applySheetKpi(projId, obj){
  ['value','disbursed'].forEach(k=>{
    if(obj[k]!=null && obj[k]!=='' && !isNaN(Number(obj[k]))) obj[k]=egp(Number(obj[k]))+' ج.م';
  });
  ['actualPct','plannedPct'].forEach(k=> obj[k]=Number(obj[k])||0);
  PROJECTS[projId].kpi = {...(PROJECTS[projId].kpi||{}), ...obj};
  if(curProj===projId && cur==='dash') renderDash();
}
function fetchKpiSheet(projId){
  const url = KPI_SHEET_LINKS[projId] || (CFG[projId]||{}).__kpiSheetUrl;
  if(!url) return;
  fetch(url).then(r=>r.text()).then(text=>{
    const obj = parseSheetCSV(text);
    if(obj) applySheetKpi(projId, obj);
  }).catch(()=>{});
}
setInterval(()=>{ fetchKpiSheet(curProj); }, 180000);


/* الإعدادات تُخزَّن داخل الرابط نفسه، فينتقل الربط مع أي شخص ترسل له الرابط */
function encodeCfg(){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(CFG)))); }catch(e){ return ''; }
}
function loadCfg(){
  try{
    const h=location.hash;
    if(h && h.startsWith('#c=')){
      CFG = JSON.parse(decodeURIComponent(escape(atob(h.slice(3)))));
    } else {
      const st = window.localStorage && localStorage.getItem('bm_cfg');
      if(st) CFG = JSON.parse(st);
    }
  }catch(e){ CFG={}; }
  applyCfg();
}
function saveCfg(){
  try{ localStorage.setItem('bm_cfg', JSON.stringify(CFG)); }catch(e){}
  try{ history.replaceState(null,'','#c='+encodeCfg()); }catch(e){}
}

    if(it.kids) it.kids.forEach(k=>list.push([k.id,k.label]));
    else list.push([it.id,it.label]);
  }));
  return list;
}

function hasDashTab(){
  return TREE.some(g=>g.items.some(it=>it.id==='dash'));

function applySettings(){
  const next={};
  currentTabList().forEach(t=>{
    const el=document.getElementById('box_'+t[0]);
    const c=parseBox(el?el.value:'');
    if(c) next[t[0]]=c;
  });
  CFG[curProj]=next;

  if(hasDashTab()){
    const kpiObj={};
    KPI_FIELDS.forEach(f=>{
      const el=document.getElementById('kpi_'+f[0]);
      let v = el ? el.value.trim() : '';
      if(f[0]==='actualPct' || f[0]==='plannedPct') v = Number(v) || 0;
      kpiObj[f[0]] = v;
    });
    CFG[curProj].__kpi = kpiObj;
    PROJECTS[curProj].kpi = kpiObj;

    const sheetEl = document.getElementById('kpiSheetUrl');
    const sheetUrl = sheetEl ? sheetEl.value.trim() : '';
    if(sheetUrl) CFG[curProj].__kpiSheetUrl = sheetUrl;
  }

  applyCfg(); saveCfg(); close_(); buildNav(); render();
  toast('تم الحفظ — التبويبات مربوطة بالدرايف');
}

function copyShare(){
  applySettings();
  const url=location.origin+location.pathname+'#c='+encodeCfg();
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast('تم نسخ رابط المشاركة'));
  else toast('انسخ الرابط من شريط العنوان');
}

function extractFolderId(link){
  if(!link) return null;
  const m = link.match(/folders\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}
function bakeFolderLinks(){
  Object.keys(FOLDER_LINKS).forEach(key=>{
    const id = extractFolderId(FOLDER_LINKS[key]);
    if(!id) return;
    const [proj, tab] = key.split('.');
    if(PROJECTS[proj] && PROJECTS[proj].V[tab]) PROJECTS[proj].V[tab].folderId = id;
  });
}

function buildNav(){
  let h='';
  TREE.forEach(g=>{
    h+=`<div class="grp">${g.grp}</div>`;
    g.items.forEach(it=>{
      if(it.kids){
        const total=it.kids.reduce((a,k)=>a+V[k.id].files.length,0);
        const isOpen=it.kids.some(k=>k.id===cur);
        h+=`<button class="nav parent ${isOpen?'open':''}" data-parent="1">
              <svg class="ico" viewBox="0 0 24 24">${it.ico}</svg>${it.label}
              <svg class="caret" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <div class="sub ${isOpen?'open':''}">
              ${it.kids.map(k=>`<button class="nav child ${cur===k.id?'on':''}" data-id="${k.id}">
                 ${k.label}<span class="n">${V[k.id].files.length}</span></button>`).join('')}
            </div>`;
      } else {
        const count = it.special ? '' : `<span class="n">${V[it.id].files.length}</span>`;
        h+=`<button class="nav ${cur===it.id?'on':''}" data-id="${it.id}">
              <svg class="ico" viewBox="0 0 24 24">${it.ico}</svg>${it.label}
              ${count}
            </button>`;
      }
    });
  });
  const side=document.getElementById('side');
  side.innerHTML=h;

  side.querySelectorAll('[data-parent]').forEach(b=>{
    b.addEventListener('click',()=>{
      b.classList.toggle('open');
      b.nextElementSibling.classList.toggle('open');
    });
  });
  side.querySelectorAll('[data-id]').forEach(b=>{
    b.addEventListener('click',()=>{
      cur=b.dataset.id;q='';buildNav();render();
      side.classList.remove('open');
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });
}

      <div class="kv-card"><div class="kv-lbl">مستخلصات منصرفة</div><div class="kv-val mono">${k.disbursed}</div></div>
    </div>`;
}

function render(){
  if(cur==='dash'){ renderDash(); return; }
  const v=V[cur];

  if(v.folderId){
    document.getElementById('main').innerHTML=`
      <div class="crumb">${PROJECTS[curProj].name}</div>
      <div class="head"><h2>${v.t}</h2><span class="cnt">مرتبط بمجلد على جوجل درايف · يتحدّث تلقائيًا</span></div>
      <iframe class="folderframe" src="${folderView(v.folderId)}"></iframe>
      ${role==='admin'?`<p style="font-size:12.5px;color:var(--steel);margin-top:10px">
        لإضافة ملف: ارفعه إلى المجلد على درايف وسيظهر هنا فورًا.</p>`:''}`;
    return;
  }

  const list=v.files.filter(f=>!q || (f[0]+f[1]).toLowerCase().includes(q.toLowerCase()));
  const top=v.files[0];

  let h=`<div class="crumb">${PROJECTS[curProj].name}</div>
  <div class="head"><h2>${v.t}</h2><span class="cnt">${v.s} · ${v.files.length} ملف</span></div>`;

  if(top){
    h+=`<section class="latest">
    <div>
      <span class="tag">آخر ملف مرفوع</span>
      <h3>${top[0]}</h3>
      <p class="meta">${top[1]} · ${top[3]} · ${top[4]}</p>
    </div>
    ${v.money && top[2] ? `<div class="amt"><p>القيمة</p><strong class="mono" style="direction:rtl">${egp(top[2])} <span style="font-size:13px;font-weight:400">ج.م</span></strong></div>`:'<div class="amt"></div>'}
    <div class="go">
      <button class="btn primary" onclick="open_(0)">فتح الملف</button>
      <button class="btn" onclick="dl(0)">تنزيل</button>
    </div>
  </section>`;
  }

  h+=`<div class="search">
    <input id="q" placeholder="ابحث عن ملف…" value="${q}">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
  </div>`;

  if(list.length){
    h+=`<div class="files">${list.map(f=>{
      const i=v.files.indexOf(f);
      return `<div class="file" onclick="open_(${i})">
        <div class="pdf"><div class="lines"></div></div>
        <div class="f-txt"><h4>${f[0]}</h4><p>${f[1]} · ${f[4]}</p></div>
        ${v.money && f[2] ? `<div class="f-amt">${egp(f[2])}<small>ج.م</small></div>`:''}
        <div class="f-date">${f[3]}</div>
        <div class="f-act">
          <button class="ib" title="فتح" onclick="event.stopPropagation();open_(${i})">
            <svg class="ico" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="ib" title="تنزيل" onclick="event.stopPropagation();dl(${i})">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"/></svg></button>
        </div>
      </div>`;}).join('')}</div>`;
  } else if(q){
    h+=`<div class="empty"><p>لا توجد ملفات مطابقة</p><span>جرّب كلمة بحث أخرى.</span></div>`;
  } else {
    h+=`<div class="empty"><p>لا توجد ملفات بعد</p><span>هتُضاف الملفات هنا أول ما تتوفر بيانات هذا القسم.</span></div>`;
  }

  if(role==='admin'){
    h+=`<div class="dz" id="dz" tabindex="0">
          <p>ارفع ملفًا جديدًا إلى «${v.t}»</p>
          <span>اسحب الملف هنا أو اضغط للاختيار — تظهر هذه المساحة لك وحدك</span>
        </div>`;
  }

  const m=document.getElementById('main');
  m.innerHTML=h;

  const qi=document.getElementById('q');
  qi.addEventListener('input',e=>{
    q=e.target.value;render();
    const n=document.getElementById('q');n.focus();n.setSelectionRange(n.value.length,n.value.length);
  });
  const dz=document.getElementById('dz');
  if(dz){
    dz.addEventListener('click',()=>toast('في النسخة النهائية: تفتح نافذة اختيار الملف'));
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('hot')});
    dz.addEventListener('dragleave',()=>dz.classList.remove('hot'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('hot');toast('تم استلام الملف — جارٍ الرفع')});
  }
}

function setRole(r){
  role=r;
  render();
}

function close_(){document.getElementById('ov').classList.remove('show')}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')close_()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close_()});

let tt;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2500);
}

document.getElementById('burger').addEventListener('click',()=>
  document.getElementById('side').classList.toggle('open'));
